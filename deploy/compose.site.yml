# Adds the website to the existing Kadjoe server stack (/srv/kadjoe, which already runs Caddy on the
# `web` network). Add it to COMPOSE_FILE in /srv/kadjoe/.env, or deploy.sh's --remove-orphans deletes the site.
services:
  caddy:
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN (e.g. kadjoe.com) in .env}
  site:
    image: ${SITE_IMAGE:?set SITE_IMAGE (kadjoe-site:<git sha>) in .env}
    pull_policy: never
    restart: unless-stopped
    init: true
    environment:
      SITE_URL: ${SITE_URL:?set SITE_URL in .env}
      SITE_ADMIN_TOKEN: ${SITE_ADMIN_TOKEN:?set SITE_ADMIN_TOKEN in .env}
      FINANCE_URL: ${FINANCE_URL:?set FINANCE_URL in .env}
      IG_APP_ID: ${IG_APP_ID:-}
      IG_APP_SECRET: ${IG_APP_SECRET:-}
    volumes:
      - ${KADJOE_SITE_HOST_DATA:-/srv/kadjoe/site-data}:/data
    networks: [web]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
